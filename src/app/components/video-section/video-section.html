<section class="relative w-full bg-black overflow-hidden">
  <video #videoPlayer [src]="videoSource" [poster]="videoPoster" class="w-full h-screen object-cover" autoplay loop
    muted playsinline preload="auto" (error)="onVideoError($event)" (loadeddata)="onVideoLoaded($event)">
    Your browser does not support the video tag.
  </video>

  <!-- Optional overlay gradient -->
  <div class="absolute inset-0 bg-gradient-to-t from-black/20 via-transparent to-transparent pointer-events-none"></div>
</section>
